@if(isOpen()) {
<div
    class="fixed w-screen h-screen bg-slate-700/40 backdrop-blur-2xl top-0 left-0 z-500"
    (click)="this.onClose()"
></div>
<div
    class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-slate-200 rounded-lg md:rounded-2xl z-1000"
>
    <div
        class="flex justify-between items-center px-4 py-2 bg-linear-to-br from-yellow-500 to-yellow-400 rounded-t-lg md:rounded-t-2xl leading-none sticky top-0 z-10"
    >
        <h1 class="text-lg font-bold text-slate-800">Set Target</h1>

        <button
            (click)="onClose()"
            class="cursor-pointer hover:text-red-600 active:opacity-70 active:text-red-600 text-red-800"
        >
            <ng-icon name="faSolidXmark" class="text-2xl"></ng-icon>
        </button>
    </div>
    <form [formGroup]="targetForm" (ngSubmit)="onSet()" class="flex p-4 flex-col gap-2">
        <span class="text-sm font-medium text-slate-700">Weight (kg)</span>
        <div
            [class.border-red-500]="!isControlValid('targetWeight', targetForm)"
            [class.border-transparent]="isControlValid('targetWeight', targetForm)"
            class="flex items-center gap-2 sm:gap-4 shadow-md bg-linear-to-br from-white to-slate-50 rounded-lg px-2 py-2 transition duration-200 border border-transparent focus-within:outline outline-amber-400"
        >
            <div class="flex justify-center">
                <ng-icon name="faSolidBullseye" class="text-amber-600/80! text-xl"></ng-icon>
            </div>
            <input
                formControlName="targetWeight"
                type="number"
                step="0.1"
                name="targetWeight"
                class="flex-1 bg-transparent outline-none text-base min-w-0"
                placeholder="Target weight"
            />
        </div>
        <div class="w-full flex justify-center gap-6 mt-6">
            <app-button
                [disabled]="!targetForm.valid"
                (clicked)="onSet()"
                fontSize="xs"
                buttonSize="sm"
                label="Save"
                buttonType="primary"
            ></app-button>
            @if(targetWeight()) {
            <app-button
                (clicked)="onClear()"
                fontSize="xs"
                buttonSize="sm"
                label="Clear"
                buttonType="danger"
            ></app-button>
            }
        </div>
    </form>
</div>

}
