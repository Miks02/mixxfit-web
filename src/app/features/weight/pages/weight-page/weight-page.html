<div #weightPage class="flex flex-col flex-wrap gap-6">
    <div class="flex gap-6 flex-wrap">
        <app-weight-page-card
            mainColor="violet"
            title="Current weight"
            subtitle="Latest body check"
            bottomContentLeft="Last measured at"
            [value]="currentWeight()"
            [metadata]="weightDelta()!"
            [bottomContentRight]="currentWeightCreatedAt()"
            [isLoading]="weightSummary.isLoading()"
            icon="faSolidScaleUnbalanced"
            buttonText="Quick log"
            [hasButton]="showQuickLog()"
            (clicked)="onQuickLog()"
            class="flex-2"
        ></app-weight-page-card>
        @if(!isTargetFormOpen()) {
        <app-weight-page-card
            mainColor="emerald"
            title="Target weight"
            subtitle="Track your progress"
            bottomContentLeft="Progress"
            [value]="targetWeightDescription()"
            [metadata]="getTargetWeightMessage()"
            [bottomContentRight]="progress()"
            [isLoading]="weightSummary.isLoading()"
            [hasButton]="true"
            (clicked)="onSetTarget()"
            buttonText="Set target"
            icon="faSolidBullseye"
            class="flex-2"
        ></app-weight-page-card>
        } @else {
        <app-set-target-form
            class="flex-2"
            [isOpen]="isTargetFormOpen()"
            [targetWeight]="targetWeight()"
            (closed)="isTargetFormOpen.set(false)"
        ></app-set-target-form>
        }
        <app-quick-tips-card class="flex-1"></app-quick-tips-card>
    </div>

    <div class="flex gap-6 flex-wrap justify-center max-h-100">
        <div
            class="bg-slate-200 rounded-lg md:rounded-2xl shadow-xl transition-shadow duration-200 hover:shadow-2xl w-full grow md:w-[35%]"
        >
            <div
                class="flex justify-between rounded-t-lg md:rounded-t-2xl md:bg-linear-to-br from-violet-500 to-violet-400 w-full px-4 py-2"
            >
                <h1 class="font-bold text-xl text-slate-800 md:text-slate-200">
                    Weight progress chart
                </h1>
            </div>

            <div class="flex flex-col gap-4">
                @if(!weightChart()) {
                <div class="flex items-center justify-center flex-col min-h-100 grow gap-4 p-4">
                    <ngx-skeleton-loader
                        count="8"
                        [theme]="{
                        'height': '30px',
                        'border-radius': '8px',
                        'background': '#D8B8E3',
                    }"
                        class="flex-1 mt-auto min-w-auto sm:min-w-85 max-w-[99%] grow w-full mx-auto"
                        appearance="line"
                    >
                    </ngx-skeleton-loader>
                </div>

                } @else if(weightChart()!.entries.length < 2) {
                <div class="flex items-center justify-center flex-col min-h-100 grow gap-3 p-4">
                    <div class="flex flex-col items-center gap-4 text-slate-600">
                        <ng-icon
                            name="faSolidChartLine"
                            class="text-4xl sm:text-6xl opacity-50"
                        ></ng-icon>
                        <p class="text-xl sm:text-2xl font-semibold text-center">
                            Weight progress chart is not available
                        </p>
                        <p class="text-lg sm:text-xl font-semibold text-center">
                            Log at least 2 weight entries to show the progress chart
                        </p>
                    </div>
                </div>

                } @else {
                <div class="flex items-center justify-center flex-col grow gap-4 min-h-100 p-4">
                    <app-weight-chart
                        [weightDataSource]="weightChart"
                        class="flex-1 min-w-auto sm:min-w-85 max-w-[99%] grow w-full mx-auto"
                    ></app-weight-chart>
                </div>
                }
            </div>
        </div>

        <app-weight-entries class="flex-2"></app-weight-entries>

        <app-quick-log #quickLog class="grow md:grow-0"></app-quick-log>
    </div>
</div>
